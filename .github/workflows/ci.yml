name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: [self-hosted, synology]
    timeout-minutes: 10
    env:
      GOFLAGS: -p=4
      GOMAXPROCS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
      - name: Install ripgrep (pinned, no sudo)
        env:
          RG_VERSION: 14.1.1
          RG_SHA256: 4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
        run: |
          set -euo pipefail
          rg_dir="${RUNNER_TEMP}/bin"
          mkdir -p "${rg_dir}" "${RUNNER_TEMP}/rg-dl"
          archive="${RUNNER_TEMP}/rg-dl/ripgrep.tar.gz"
          curl -fsSL -o "${archive}" "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${RG_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/rg-dl" --strip-components=1 "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg"
          install -m 0755 "${RUNNER_TEMP}/rg-dl/rg" "${rg_dir}/rg"
          echo "${rg_dir}" >> "${GITHUB_PATH}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
          cache: false
      - run: ./scripts/ci_local.sh
        env:
          GH_TOKEN: ${{ github.token }}
          HELIANTHUS_EXTERNAL_LINT_JOB: "1"

  lint:
    runs-on: [self-hosted, synology]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
