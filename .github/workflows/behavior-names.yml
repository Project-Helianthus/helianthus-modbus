name: Behavior names

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  behavior-names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test declaration and filename ratchet
        env:
          GOWORK: "off"
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: local
          GOFLAGS: -buildvcs=false
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_behavior_name_gate.py' -v
          python3 scripts/check_behavior_names.py --check
