name: Go readability

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  readability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.22"
          cache: false
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.11.4
      - run: python3 -m unittest discover -s scripts/tests -p 'test_go_lint_baseline.py' -v
      - run: python3 scripts/check_go_lint_baseline.py --check
